[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.8.4"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
authors = ["CAMpanion contributors"]
repository = "https://github.com/mountainarcwelding/campanion"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MIT. JSON Schema for the on-disk IR.
schemars = "1.2.3"
# Pinned in Cargo.lock. Default features are empty; do not enable `unsafe_optimizations`.
cavalier_contours = { version = "0.9.0", default-features = false }
campanion-geom = { path = "crates/geom" }
campanion-mesh = { path = "crates/mesh" }
campanion-import = { path = "crates/import" }
campanion-path = { path = "crates/path" }
campanion-ir = { path = "crates/ir" }
campanion-post = { path = "crates/post" }
campanion-turn = { path = "crates/turn" }
campanion-cli = { path = "crates/cli" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
dbg_macro = "warn"
too_many_arguments = "allow"
type_complexity = "allow"
neg_cmp_op_on_partial_ord = "allow"
