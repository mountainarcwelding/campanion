[package]
name = "campanion-gui"
description = "Graphical workspace for CAMpanion. The program is still primarily command-line driven; this GUI is in development."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "campanion_gui"
path = "src/lib.rs"

[[bin]]
name = "campanion-gui"
path = "src/main.rs"

[dependencies]
campanion-ir.workspace = true
campanion-geom.workspace = true
campanion-import.workspace = true
campanion-path.workspace = true
campanion-view = { path = "../view" }
campanion-cli = { path = "../cli" }
thiserror.workspace = true
serde_json.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["glow", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal", "wayland"] }
